name: SVOperation Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build and verify Forge mod
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Validate OBJ weapon source mesh
        run: python scripts/verify-obj.py
      - name: Validate Geran game aircraft mesh
        run: python scripts/verify-geran.py
      - name: Compile Java sources
        run: gradle --no-daemon compileJava
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Prepare CC0 audio assets
        run: bash scripts/prepare-audio.sh
      - name: Build
        run: gradle --no-daemon --stacktrace clean build
      - name: Verify distributable JAR
        shell: bash
        run: |
          shopt -s nullglob
          jars=(build/libs/*-all.jar)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one Jar-in-Jar artifact, found ${#jars[@]}"
            printf '%s\n' build/libs/*.jar
            exit 1
          fi
          python scripts/verify-artifact.py "${jars[0]}"
          test -s "${jars[0]}.sha256"
      - name: Upload verified mod and checksum
        uses: actions/upload-artifact@v4
        with:
          name: SVOperation-${{ github.sha }}
          path: |
            build/libs/*-all.jar
            build/libs/*-all.jar.sha256
          if-no-files-found: error
          retention-days: 30
